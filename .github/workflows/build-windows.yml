name: Build Installers

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: ledger-windows-installer
          path: release/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: ledger-macos-installer
          path: release/*.dmg
