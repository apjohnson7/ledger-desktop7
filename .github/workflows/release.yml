name: Build and publish desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  # The installers are unsigned. Keep electron-builder from searching for a
  # signing identity or attempting notarization on the CI runners.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: ledger-windows
          if-no-files-found: error
          path: release/*.exe

  macos:
    name: macOS ${{ matrix.arch }} installer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub retired the macos-13 and macos-14 images. These are the
          # current Intel and Apple Silicon labels for public repositories.
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build macOS installer
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ledger-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  publish:
    name: Verify and publish GitHub release
    needs:
      - windows
      - macos
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh assets

      - name: Verify installers before publishing
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmgs=(assets/*.dmg)
          zips=(assets/*.zip)
          exes=(assets/*.exe)

          echo "DMGs: ${#dmgs[@]}  ZIPs: ${#zips[@]}  EXEs: ${#exes[@]}"
          if [ "${#dmgs[@]}" -ne 2 ] || [ "${#zips[@]}" -ne 2 ] || [ "${#exes[@]}" -ne 1 ]; then
            echo "Unexpected release asset set"
            exit 1
          fi

          for f in "${dmgs[@]}"; do
            echo "::group::Verify $f"
            hdiutil verify "$f"

            mountpoint="$(mktemp -d "$RUNNER_TEMP/dmg.XXXXXX")"
            hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$f" >/dev/null
            app="$mountpoint/Ledger.app"
            test -d "$app"

            binary_archs="$(lipo -archs "$app/Contents/MacOS/Ledger")"
            echo "binary architectures: $binary_archs"
            native="$app/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3-multiple-ciphers/build/Release/better_sqlite3.node"
            native_info="$(file -b "$native")"
            echo "native module: $native_info"

            case "$f" in
              *arm64*)
                echo "$binary_archs" | grep -qw arm64
                echo "$native_info" | grep -q arm64
                ;;
              *)
                echo "$binary_archs" | grep -qw x86_64
                echo "$native_info" | grep -q x86_64
                ;;
            esac

            hdiutil detach "$mountpoint" >/dev/null
            rmdir "$mountpoint"
            echo "::endgroup::"
          done

          for f in "${zips[@]}"; do
            echo "Testing $f"
            unzip -t "$f" >/dev/null
          done

          echo "Windows installer:"
          file "${exes[0]}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Ledger ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            ## Ledger desktop release

            Offline, encrypted ledger for Windows and macOS.

            ### Downloads
            - **Windows:** `Ledger.Setup.1.0.0.exe`
            - **macOS Intel:** `Ledger-1.0.0.dmg` (or `Ledger-1.0.0-mac.zip`)
            - **macOS Apple Silicon:** `Ledger-1.0.0-arm64.dmg` (or `Ledger-1.0.0-arm64-mac.zip`)

            ### Install
            - **Windows:** run the installer. SmartScreen may warn because the
              build is unsigned; choose *More info* then *Run anyway*.
            - **macOS:** open the `.dmg` and drag Ledger to Applications. The
              build is unsigned, so if Gatekeeper blocks it, right-click the app
              and choose *Open* once.
            - **macOS zip:** unzip, then move Ledger.app to Applications.

            The app stores its encrypted database locally in your user profile.
            No account or internet connection is required.

            Verified with a 1,000,000-record stress test: a full backup export and
            restore preserved every record, total, and login credential with no
            corruption.
          files: |
            assets/*.exe
            assets/*.dmg
            assets/*.zip
